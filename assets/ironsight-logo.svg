<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0099CC;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFE0;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E14;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111922;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" rx="12" fill="url(#bgGrad)"/>

  <!-- HUD corner brackets -->
  <path d="M20 20 L20 40 M20 20 L40 20" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.4"/>
  <path d="M780 20 L780 40 M780 20 L760 20" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.4"/>
  <path d="M20 180 L20 160 M20 180 L40 180" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.4"/>
  <path d="M780 180 L780 160 M780 180 L760 180" fill="none" stroke="#00D4FF" stroke-width="2" opacity="0.4"/>

  <!-- Eye/Vision icon -->
  <g transform="translate(60, 45)" filter="url(#glow)">
    <!-- Outer eye shape -->
    <path d="M0 55 Q40 0 80 55 Q40 110 0 55 Z" fill="none" stroke="url(#cyberGrad)" stroke-width="2.5"/>
    <!-- Inner pupil -->
    <circle cx="40" cy="55" r="18" fill="none" stroke="#00D4FF" stroke-width="2"/>
    <circle cx="40" cy="55" r="8" fill="#00D4FF" opacity="0.4"/>
    <!-- Scan line -->
    <line x1="10" y1="55" x2="70" y2="55" stroke="#00FFE0" stroke-width="1" opacity="0.5"/>
    <!-- Neural dots -->
    <circle cx="15" cy="30" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="65" cy="30" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="15" cy="80" r="2" fill="#00D4FF" opacity="0.6"/>
    <circle cx="65" cy="80" r="2" fill="#00D4FF" opacity="0.6"/>
    <!-- Neural connections -->
    <line x1="15" y1="30" x2="40" y2="55" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="65" y1="30" x2="40" y2="55" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="15" y1="80" x2="40" y2="55" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
    <line x1="65" y1="80" x2="40" y2="55" stroke="#00D4FF" stroke-width="0.8" opacity="0.3"/>
    <!-- HUD target rings -->
    <circle cx="40" cy="55" r="30" fill="none" stroke="#00D4FF" stroke-width="0.8" opacity="0.25" stroke-dasharray="4 4"/>
  </g>

  <!-- Text -->
  <text x="180" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="700" fill="url(#cyberGrad)" letter-spacing="3" filter="url(#glow)">IronSight</text>
  <text x="540" y="90" font-family="'Segoe UI', Arial, sans-serif" font-size="62" font-weight="300" fill="#00D4FF" letter-spacing="3">AI</text>
  <text x="182" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#5A7A8A" letter-spacing="8">PREDICTIVE MAINTENANCE</text>

  <!-- Subtle scan lines -->
  <line x1="180" y1="140" x2="700" y2="140" stroke="#00D4FF" stroke-width="0.5" opacity="0.15"/>
  <line x1="180" y1="155" x2="650" y2="155" stroke="#00D4FF" stroke-width="0.5" opacity="0.1"/>
</svg>